# Coturn TURN Server Configuration
# Reference: https://github.com/coturn/coturn

# Listening ports
listening-port=3478
tls-listening-port=5349

# External IP address (需要配置實際的公網 IP)
# 如果是本地測試，可以註釋掉
# external-ip=YOUR_SERVER_PUBLIC_IP

# Relay IP address (通常與 listening IP 相同)
# relay-ip=YOUR_SERVER_PUBLIC_IP

# Realm (用於認證)
realm=yourdomain.com
server-name=coturn

# Authentication
lt-cred-mech

# 用戶憑證（格式：username:password）
# 生產環境應該使用更強的密碼
user=turnuser:turnpassword

# 可以添加更多用戶
# user=user2:password2

# 禁用舊版 TLS
no-tlsv1
no-tlsv1_1

# Logging
# verbose
no-stdout-log

# TURN Relay 端口範圍
min-port=49160
max-port=49200

# 其他安全選項
fingerprint
no-multicast-peers

# 限制
# max-bps=1000000  # 每個會話最大頻寬 (bytes/sec)

# 白名單（可選）
# allowed-peer-ip=10.0.0.0/8
# allowed-peer-ip=172.16.0.0/12
# allowed-peer-ip=192.168.0.0/16

# 資料庫（可選 - 用於持久化憑證）
# db="host=localhost dbname=coturn user=coturn password=coturn"
