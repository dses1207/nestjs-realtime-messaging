# ================================
# Nginx Reverse Proxy Configuration
# ================================
# This configuration sets up nginx as a reverse proxy for all services:
# - API Gateway (HTTP REST)
# - WebSocket Server (Socket.IO)
# - MinIO Object Storage (file uploads/downloads)
# - LiveKit WebRTC Server (video/voice calls)
#
# Place this file in /etc/nginx/sites-available/ and symlink to sites-enabled/
# Then run: sudo nginx -t && sudo nginx -s reload

# 1. HTTP -> HTTPS redirect
server {
    listen 80;
    server_name im.example.com;
    return 301 https://$host$request_uri;
}

# 2. Backend upstreams
upstream api_backend {
    server 127.0.0.1:8000;   # API Gateway (production port)
}

upstream websocket_backend {
    server 127.0.0.1:8001;   # WebSocket Server (production port)
}

upstream minio_backend {
    server 127.0.0.1:9000;   # MinIO S3 API
}

upstream livekit_backend {
    server 127.0.0.1:7880;   # LiveKit WebRTC SFU
}

# 3. Main HTTPS server
server {
    listen 443 ssl http2;
    server_name im.example.com;

    # SSL certificates
    ssl_certificate     /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    # SSL hardening
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Logs
    access_log /var/log/nginx/im_access.log;
    error_log  /var/log/nginx/im_error.log warn;

    # ── API Gateway ──────────────────────────────────────────
    # All REST API requests: https://im.example.com/api/*
    # Proxied to API Gateway with /api/ prefix stripped
    location /api/ {
        proxy_pass         http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ── WebSocket (Socket.IO) ────────────────────────────────
    # Real-time messaging: wss://im.example.com/socket.io/
    location /socket.io/ {
        proxy_pass           http://websocket_backend;
        proxy_http_version   1.1;
        proxy_set_header     Upgrade $http_upgrade;
        proxy_set_header     Connection "upgrade";
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_read_timeout   3600s;  # Long-lived WebSocket connections
        proxy_cache_bypass   $http_upgrade;
    }

    # ── MinIO (Object Storage) ───────────────────────────────
    # File uploads/downloads: https://im.example.com/minio/*
    # Pre-signed URLs from file-service point here
    location /minio/ {
        proxy_pass http://minio_backend/;
        proxy_pass_request_headers off;

        # CORS headers for browser-based uploads
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        client_max_body_size 200M;  # Match gRPC max message size

        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With';
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain';
            return 204;
        }
    }

    # ── LiveKit WebRTC ───────────────────────────────────────
    # Video/voice calls: wss://im.example.com/livekit/
    location /livekit/ {
        rewrite ^/livekit/(.*) /$1 break;
        rewrite ^/livekit$ / break;

        proxy_pass http://livekit_backend;
        proxy_http_version 1.1;

        # WebSocket support (required for WebRTC signaling)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for WebRTC sessions
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 60s;

        # Disable buffering for real-time communication
        proxy_buffering off;
    }
}

# ================================
# Traffic Flow
# ================================
#
#   Client (HTTPS)
#     │
#     ▼
#   Nginx (:443)
#     ├── /api/*        → API Gateway (:8000)    → gRPC microservices
#     ├── /socket.io/*  → WebSocket   (:8001)    → real-time messaging
#     ├── /minio/*      → MinIO       (:9000)    → file upload/download
#     └── /livekit/*    → LiveKit     (:7880)    → WebRTC video/voice
#
# ================================
# Development Ports (without nginx)
# ================================
# If running locally without nginx, services are at:
#   API Gateway:   http://localhost:3050
#   WebSocket:     ws://localhost:3001
#   MinIO Console: http://localhost:9001
#   LiveKit:       ws://localhost:7880
